{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg border-0 p-4">

<h3 class="text-warning text-center mb-4">
Change Password
</h3>

<form method="post">
{% csrf_token %}

<!-- OLD PASSWORD -->
<div class="mb-3">
<label class="form-label">Current Password</label>
<input type="password"
name="old_password"
class="form-control"
required>
</div>

<!-- NEW PASSWORD -->
<div class="mb-3">
<label class="form-label">New Password</label>
<input type="password"
name="new_password1"
class="form-control"
required>
</div>

<!-- CONFIRM PASSWORD -->
<div class="mb-3">
<label class="form-label">Confirm New Password</label>
<input type="password"
name="new_password2"
class="form-control"
required>
</div>

<!-- ERRORS -->
{% if form.errors %}
<div class="alert alert-danger">
<ul class="mb-0">
{% for field in form %}
    {% for error in field.errors %}
        <li>{{ error }}</li>
    {% endfor %}
{% endfor %}
</ul>
</div>
{% endif %}

<!-- BUTTONS -->
<div class="d-grid gap-2">

<button class="btn btn-warning">
Update Password
</button>

<a href="/profile/" class="btn btn-secondary">
Cancel
</a>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
