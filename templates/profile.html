{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow-lg border-0 p-4">

<h2 class="text-success mb-4 text-center">
My Profile
</h2>

<p class="text-muted text-center mb-4">
Manage your account details and delivery information
</p>

<form method="post">
{% csrf_token %}

<!-- USERNAME (READ ONLY) -->
<div class="mb-4">
<label class="form-label">Username</label>
<input
type="text"
class="form-control"
value="{{ user.username }}"
readonly>
</div>

<!-- CUSTOMER NAME -->
<div class="mb-4">
<label class="form-label">Customer Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ user.first_name }}"
placeholder="Enter your name"
required>
</div>

<!-- EMAIL -->
<div class="mb-4">
<label class="form-label">Email</label>
<input
type="email"
name="email"
class="form-control"
value="{{ user.email }}"
placeholder="Enter email"
required>
</div>

<!-- PHONE -->
<div class="mb-4">
<label class="form-label">Phone Number</label>
<input
type="text"
name="phone"
class="form-control"
value="{{ profile.phone }}"
placeholder="Enter mobile number">
</div>

<!-- ADDRESS -->
<div class="mb-4">
<label class="form-label">Delivery Address</label>
<textarea
name="address"
class="form-control"
rows="4"
placeholder="Enter full address">{{ profile.address }}</textarea>
</div>

<!-- ACTION BUTTONS -->
<div class="d-grid">

<button class="btn btn-success mb-2">
Save Profile
</button>

<a href="/change-password/" class="btn btn-outline-warning mb-2">
Change Password
</a>

<a href="/customer-dashboard/" class="btn btn-light">
Back to Dashboard
</a>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
