{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-5">

<div class="card shadow p-4">

<a href="{{ request.META.HTTP_REFERER|default:'/home/' }}" class="btn btn-secondary">
← Back
</a>

<h2 class="text-center mb-4">
Login
</h2>

{% if user.is_authenticated %}
<div class="alert alert-success">
Welcome {{ user.username }}
</div>
{% endif %}

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label>Username</label>
<input
type="text"
name="username"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
name="password"
class="form-control"
required>
</div>

<button
type="submit"
class="btn btn-success w-100">
Login
</button>

</form>

<div class="text-center mt-3">

<a href="/signup/">
Create Customer Account
</a>

</div>

</div>
</div>
</div>

{% endblock %}
