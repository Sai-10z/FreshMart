{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow p-4">

<a href="{{ request.META.HTTP_REFERER|default:'/home/' }}" class="btn btn-secondary">
← Back
</a>

<h2 class="text-center mb-4 text-success">Customer Signup</h2>

{% if form.errors %}
<div class="alert alert-danger">
{{ form.errors }}
</div>
{% endif %}

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label>Full Name</label>
<input type="text" name="full_name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Username</label>
{{ form.username }}
</div>

<div class="mb-3">
<label>Password</label>
{{ form.password1 }}
</div>

<div class="mb-3">
<label>Confirm Password</label>
{{ form.password2 }}
</div>

<button type="submit" class="btn btn-success w-100">
Create Account
</button>

</form>

</div>

</div>
</div>

{% endblock %}
