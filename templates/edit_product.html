{% extends 'base.html' %}

{% block content %}

<a href="/vendor-dashboard/" class="btn btn-secondary mb-3">
← Back to Dashboard
</a>

<h2 class="mb-4 text-primary">
Edit Product
</h2>

<div class="card shadow-sm p-4">

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Product Name</label>
<input type="text"
name="name"
class="form-control"
value="{{ product.name }}"
required>
</div>

<div class="mb-3">
<label class="form-label">Price (₹ per kg)</label>
<input type="number"
step="0.01"
name="price"
class="form-control"
value="{{ product.price }}"
required>
</div>

<div class="mb-3">
<label class="form-label">Category</label>

<select name="category" class="form-select">

<option value="Fruit"
{% if product.category == 'Fruit' %}selected{% endif %}>
Fruit
</option>

<option value="Vegetable"
{% if product.category == 'Vegetable' %}selected{% endif %}>
Vegetable
</option>

</select>

</div>

<div class="mb-3">
<label class="form-label">Change Image</label>
<input type="file" name="image" class="form-control">
</div>

<div class="form-check mb-4">

<input
type="checkbox"
name="is_available"
class="form-check-input"
{% if product.is_available %}checked{% endif %}>

<label class="form-check-label">
Available to Customers
</label>

</div>

<!-- ✅ BUTTONS -->
<div class="d-flex gap-2">

<button type="submit" class="btn btn-primary w-50">
Save Changes
</button>

<a href="{{ request.GET.next|default:'/vendor-inventory/' }}"
class="btn btn-secondary w-50">
Discard Changes
</a>

</div>

</form>

</div>

{% endblock %}
